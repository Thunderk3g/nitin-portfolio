<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects — Nitin Wagh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15171c}
a{color:#f4efe6}a:hover{color:#ffffff}
a:focus-visible,button:focus-visible{outline:2px solid #6f9bff;outline-offset:3px}
.nw-nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;color:#f4efe6;text-decoration:none;font-size:16px}
.nw-nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:2px;background:#2f6bff}
.nw-display{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:75%;text-transform:uppercase;line-height:.95}
.nw-card{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#1c1f26;border:1px solid rgba(244,239,230,.08);color:#f4efe6;text-align:left;font:inherit;padding:0;cursor:pointer;transition:transform .3s ease,border-color .3s}
.nw-card:hover{transform:translateY(-4px);border-color:rgba(47,107,255,.6)}
.nw-thumb{position:relative;display:flex;align-items:center;justify-content:center;color:rgba(244,239,230,.55);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.nw-play{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(31,92,255,.92);display:flex;align-items:center;justify-content:center}
.nw-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.nw-grid-portrait{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.nw-grid-land{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.nw-ghost{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(244,239,230,.3);background:transparent;color:#f4efe6;font:inherit;font-size:15px;cursor:pointer}
.nw-ghost:hover{border-color:#2f6bff}
.nw-pill{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:#1c1f26;border:1px solid rgba(244,239,230,.12);color:#f4efe6;font:inherit;font-size:14px;cursor:pointer}
.nw-pill:hover{border-color:#2f6bff}
@media (max-width:1000px){.nw-grid-portrait{grid-template-columns:repeat(2,minmax(0,1fr))}.nw-grid-land{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.nw-grid2,.nw-grid-land{grid-template-columns:minmax(0,1fr)}.nw-pad{padding-left:20px !important;padding-right:20px !important}.nw-navlinks{gap:20px !important}.nw-brand{display:none !important}}
</style>

</head>
<body>
<main style="min-height: 100vh; background: #15171c; color: #f4efe6; font-family: 'Manrope', 'Helvetica Neue', sans-serif">
<header class="nw-pad" style="display: flex; align-items: center; gap: 28px; padding: 36px 64px 0">
<a class="nw-brand" href="index.html" style="flex: 0 0 auto; color: #f4efe6; text-decoration: none; font-size: 16px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase">Nitin Wagh</a>
<span class="nw-brand" aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: #2f6bff; opacity: 0.8"></span>
<nav class="nw-nav nw-navlinks" aria-label="Main" style="display: flex; gap: 52px; margin-left: auto">
<a href="index.html">Home</a>
<a href="projects.html" aria-current="page">Projects</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<div id="app"></div>
<footer class="nw-pad" style="border-top: 1px solid rgba(244,239,230,0.1); padding: 32px 64px; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; font-size: 15px">
<span style="letter-spacing: 0.32em; text-transform: uppercase">Nitin Wagh</span>
<nav class="nw-nav" aria-label="Footer" style="display: flex; gap: 28px; flex-wrap: wrap">
<a href="mailto:[Your Email Address]">Email Me</a>
<a href="[Your LinkedIn Profile URL]">LinkedIn</a>
<a href="index.html">Home</a>
<a href="contact.html">Contact</a>
</nav>
</footer>
</main>
<script>
/* Projects page: category list → category gallery → video player.
   Replace PROJECTS data with real videos (see HANDOFF.md). */
const CATS = [
  { slug: 'short-form', title: 'Short-form & Reels', desc: 'Vertical edits for Reels, Shorts and social feeds.', bg: 'linear-gradient(150deg, #24324f 0%, #12161f 100%)', vertical: true },
  { slug: 'long-form', title: 'Long-form Videos', desc: 'Longer edits paced to hold attention from start to finish.', bg: 'linear-gradient(150deg, #3a2a44 0%, #15121b 100%)', vertical: false },
  { slug: 'saas', title: 'SaaS Demos', desc: 'Product walkthroughs that make software easy to follow.', bg: 'linear-gradient(150deg, #1e3a3d 0%, #10171a 100%)', vertical: false },
  { slug: 'cinematic', title: 'Cinematic Content', desc: 'Mood-led edits built on rhythm, sound and colour.', bg: 'linear-gradient(150deg, #43341f 0%, #18140e 100%)', vertical: false }
];
// Placeholder projects: { title, role, video (url), poster (url), brief, contribution, tools }
const PROJECTS = Object.fromEntries(CATS.map(c => [c.slug, Array.from({ length: 6 }, (_, i) => ({
  title: `[Project title ${i + 1}]`, role: '[Your role]', video: '', poster: '',
  brief: '[Short project brief]', contribution: '[What you contributed]', tools: '[Tools used, optional]'
}))]));

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const play = '<span class="nw-play" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="#fff"><path d="M5 3.5v11l9-5.5z"/></svg></span>';
const thumb = (c, p, ratio, label) => `<span class="nw-thumb" style="aspect-ratio:${ratio};width:100%;background:${p && p.poster ? `center/cover url('${esc(p.poster)}')` : c.bg}">${p && p.poster ? '' : label}${p ? play : ''}</span>`;

function render() {
  const [slug, idx] = location.hash.replace('#', '').split('/');
  const cat = CATS.find(c => c.slug === slug);
  if (!cat) {
    app.innerHTML = `<section class="nw-pad" style="padding:88px 64px 120px;max-width:1312px;margin:0 auto">
      <h1 class="nw-display" style="margin:0;font-size:clamp(56px,8vw,120px)">Projects</h1>
      <p style="margin:18px 0 0;max-width:620px;font-size:18px;font-weight:300;line-height:1.6;color:rgba(244,239,230,.78)">Pick a category to see more examples of that type of work.</p>
      <div class="nw-grid2" style="margin-top:56px">${CATS.map(c => `
        <a class="nw-card" href="#${c.slug}" style="text-decoration:none">${thumb(c, null, '16 / 9', '[Category thumbnail]')}
          <span style="display:flex;flex-direction:column;gap:10px;padding:24px 26px 28px">
            <span style="font-size:24px;font-weight:600">${c.title}</span>
            <span style="font-size:16px;font-weight:300;line-height:1.6;color:rgba(244,239,230,.78)">${c.desc}</span>
            <span style="margin-top:6px;color:#5b8cff;font-weight:600">View Projects →</span></span></a>`).join('')}
      </div></section>`;
    return;
  }
  const ratio = cat.vertical ? '9 / 16' : '16 / 9', fmt = cat.vertical ? 'Vertical 9:16' : 'Landscape 16:9';
  const list = PROJECTS[cat.slug];
  app.innerHTML = `<section class="nw-pad" style="padding:56px 64px 120px;max-width:1312px;margin:0 auto">
    <a class="nw-ghost" href="#" style="text-decoration:none">← Back to Projects</a>
    <h1 class="nw-display" style="margin:32px 0 0;font-size:clamp(48px,7vw,104px)">${cat.title}</h1>
    <p style="margin:16px 0 0;max-width:620px;font-size:18px;font-weight:300;line-height:1.6;color:rgba(244,239,230,.78)">${cat.desc}</p>
    <div class="${cat.vertical ? 'nw-grid-portrait' : 'nw-grid-land'}" style="margin-top:48px">${list.map((p, i) => `
      <a class="nw-card" href="#${cat.slug}/${i}" style="text-decoration:none" aria-label="Play ${esc(p.title)}">${thumb(cat, p, ratio, '[Poster thumbnail]')}
        <span style="display:flex;flex-direction:column;gap:6px;padding:16px 18px 20px">
          <span style="font-size:18px;font-weight:600">${esc(p.title)}</span>
          <span style="font-size:14px;color:rgba(244,239,230,.7)">${fmt} · ${esc(p.role)}</span></span></a>`).join('')}
    </div>
    <div style="margin-top:72px;border-top:1px solid rgba(244,239,230,.12);padding-top:32px">
      <p style="margin:0 0 16px;font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#5b8cff">Other categories</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">${CATS.filter(c => c !== cat).map(c => `<a class="nw-pill" href="#${c.slug}" style="text-decoration:none">${c.title}</a>`).join('')}</div>
    </div></section>`;
  const p = idx != null ? list[+idx] : null;
  if (!p) return;
  const dlg = document.createElement('div');
  dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true'); dlg.setAttribute('aria-label', p.title);
  dlg.style.cssText = 'position:fixed;inset:0;z-index:20;background:rgba(10,11,14,.88);display:flex;padding:24px;overflow-y:auto';
  dlg.innerHTML = `<div style="margin:auto;width:min(100%,${cat.vertical ? '440px' : '1040px'});background:#1c1f26;border-radius:16px;overflow:hidden;border:1px solid rgba(244,239,230,.1)">
    <div id="stage" style="position:relative;aspect-ratio:${ratio};width:${cat.vertical ? 'min(100%, calc(64vh * 0.5625))' : '100%'};margin:0 auto;background:#0d0f13;display:flex;align-items:center;justify-content:center">
      <button id="playBtn" type="button" aria-label="Play video" style="position:absolute;inset:0;border:0;background:${p.poster ? `center/cover url('${esc(p.poster)}')` : cat.bg};color:rgba(244,239,230,.6);font:inherit;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center">${p.poster ? '' : '[Poster thumbnail]'}${play}</button>
    </div>
    <div style="padding:24px 28px 28px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
        <div><h2 style="margin:0;font-size:24px;font-weight:600">${esc(p.title)}</h2>
        <p style="margin:6px 0 0;font-size:14px;color:rgba(244,239,230,.7)">${cat.title} · ${fmt} · ${esc(p.role)}</p></div>
        <a class="nw-ghost" href="#${cat.slug}" style="text-decoration:none" aria-label="Close player">Close</a>
      </div>
      <p style="margin:0;font-size:16px;font-weight:300;line-height:1.6;color:rgba(244,239,230,.85)"><strong style="font-weight:600">Brief:</strong> ${esc(p.brief)}</p>
      <p style="margin:0;font-size:16px;font-weight:300;line-height:1.6;color:rgba(244,239,230,.85)"><strong style="font-weight:600">My contribution:</strong> ${esc(p.contribution)}</p>
      <p style="margin:0;font-size:16px;font-weight:300;line-height:1.6;color:rgba(244,239,230,.85)"><strong style="font-weight:600">Tools:</strong> ${esc(p.tools)}</p>
      <div><a class="nw-ghost" href="#" style="text-decoration:none">← Back to Projects</a></div>
    </div></div>`;
  app.appendChild(dlg);
  // Playback starts only on click; poster shown until then.
  dlg.querySelector('#playBtn').addEventListener('click', () => {
    const stage = dlg.querySelector('#stage');
    stage.innerHTML = p.video
      ? `<video src="${esc(p.video)}" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:#000"></video>`
      : '<span style="color:rgba(244,239,230,.6);font-size:14px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:16px">[Video file or link plays here]</span>';
  });
  dlg.addEventListener('click', e => { if (e.target === dlg) location.hash = cat.slug; });
}
addEventListener('hashchange', render);
addEventListener('keydown', e => { if (e.key === 'Escape' && location.hash.includes('/')) location.hash = location.hash.split('/')[0]; });
render();
</script>
</body>
</html>
