<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects | Nitin Wagh</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Video editing projects by Nitin Wagh: short-form and reels, long-form videos, SaaS demos and cinematic content.">
<meta property="og:title" content="Projects | Nitin Wagh">
<meta property="og:type" content="website">
<meta name="theme-color" content="#15171c">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.page-header{padding:28px var(--gutter) 0}
#app{flex:1 0 auto}
.intro{padding-top:88px;padding-bottom:128px}
.gallery{padding-top:48px;padding-bottom:128px}
.page-title{margin:0;font-size:clamp(56px,8vw,120px)}
.gallery .page-title{margin-top:36px;font-size:clamp(48px,7vw,104px)}
.lede{margin:18px 0 0;max-width:56ch;font-size:18px;line-height:1.6;color:var(--ink-2)}
.intro .cats{margin-top:64px}
.clips{display:grid;gap:40px 20px;margin-top:56px}
.clips-portrait{grid-template-columns:repeat(4,minmax(0,1fr))}
.clips-land{grid-template-columns:repeat(3,minmax(0,1fr))}
.clip{display:flex;flex-direction:column;gap:6px;color:var(--ink);text-decoration:none}
.clip:hover{color:var(--ink)}
.clip-media{display:block;width:100%;margin-bottom:10px;border-radius:var(--r);background-size:cover;background-position:center;transition:transform .6s var(--ease)}
.clip:hover .clip-media{transform:translateY(-4px)}
.clip-title{font-size:17px;font-weight:600}
.clip-meta{font-size:14px;color:var(--ink-3)}
.play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:999px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(244,239,230,.3);background:rgba(16,18,22,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background-color .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
.play svg{margin-left:3px}
.clip:hover .play,.player-poster:hover .play{background:var(--accent);border-color:var(--accent);transform:scale(1.06)}
.clip .ph-label{align-items:flex-end;padding-bottom:18px}
.others{margin-top:88px;border-top:1px solid var(--line);padding-top:32px}
.others p{margin:0 0 16px;font-size:14px;font-weight:500;color:var(--ink-3)}
.others div{display:flex;gap:10px;flex-wrap:wrap}

/* Player */
.player-backdrop{position:fixed;inset:0;z-index:var(--z-modal);display:flex;padding:24px;overflow-y:auto;background:rgba(10,11,14,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.player{margin:auto;width:min(100%,1040px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 40px 80px -40px rgba(5,6,9,.9)}
.player-vertical{width:min(100%,440px)}
.player-stage{position:relative;width:100%;margin:0 auto;background:var(--bg-deep);display:flex;align-items:center;justify-content:center}
.player-vertical .player-stage{width:min(100%,calc(64vh * .5625))}
.player-poster{position:absolute;inset:0;border:0;padding:0;font:inherit;cursor:pointer;outline-offset:-4px;background-size:cover;background-position:center}
.player-poster .ph-label{align-items:flex-end;padding-bottom:22px}
.player-stage video{width:100%;height:100%;object-fit:contain;background:var(--bg-deep)}
.player-empty{padding:16px;text-align:center;font-size:14px;color:var(--ink-3)}
.player-body{padding:24px 28px 28px}
.player-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.player-head h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.player-head p{margin:6px 0 0;font-size:14px;color:var(--ink-3)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 28px;margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.player-vertical .facts{grid-template-columns:minmax(0,1fr)}
.facts dt{font-size:13px;font-weight:500;color:var(--ink-3)}
.facts dd{margin:6px 0 0;font-size:15.5px;line-height:1.6;color:var(--ink-2)}
.player-foot{margin-top:24px}

@media (max-width:1000px){.clips-portrait{grid-template-columns:repeat(2,minmax(0,1fr))}.clips-land{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.page-header{padding-top:16px}.intro{padding-top:56px;padding-bottom:88px}.gallery{padding-top:32px;padding-bottom:88px}}
@media (max-width:700px){.clips-land{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:minmax(0,1fr)}.player-backdrop{padding:12px}.player-body{padding:20px}}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<div class="page">
<header class="site-header page-header">
<a class="brand" href="index.html">Nitin Wagh</a>
<span class="brand-rule" aria-hidden="true"></span>
<nav class="nav" aria-label="Main">
<a href="index.html">Home</a>
<a href="projects.html" aria-current="page">Projects</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<main id="app"></main>

<footer class="site-footer">
<span class="brand">Nitin Wagh</span>
<nav class="nav" aria-label="Footer">
<a href="mailto:[Your Email Address]">Email me</a>
<a href="[Your LinkedIn Profile URL]">LinkedIn</a>
<a href="index.html">Home</a>
<a href="contact.html">Contact</a>
</nav>
</footer>
</div>
<script>
/* Projects page: category list → category gallery → video player.
   Replace PROJECTS data with real videos (see HANDOFF.md). */
const CATS = [
  { slug: 'short-form', title: 'Short-form & Reels', desc: 'Vertical edits for Reels, Shorts and social feeds.', tone: '#262f45', vertical: true },
  { slug: 'long-form', title: 'Long-form Videos', desc: 'Longer edits paced to hold attention from start to finish.', tone: '#352c36', vertical: false },
  { slug: 'saas', title: 'SaaS Demos', desc: 'Product walkthroughs that make software easy to follow.', tone: '#233236', vertical: false },
  { slug: 'cinematic', title: 'Cinematic Content', desc: 'Mood-led edits built on rhythm, sound and colour.', tone: '#3a3226', vertical: false }
];
// Placeholder projects: { title, role, video (url), poster (url), brief, contribution, tools }
const PROJECTS = Object.fromEntries(CATS.map(c => [c.slug, Array.from({ length: 6 }, (_, i) => ({
  title: `[Project title ${i + 1}]`, role: '[Your role]', video: '', poster: '',
  brief: '[Short project brief]', contribution: '[What you contributed]', tools: '[Tools used, optional]'
}))]));

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const arrow = '<svg class="arrow" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h14M12 5l5 5-5 5"/></svg>';
const back = '<svg class="arrow arrow-back" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 10H3M8 5l-5 5 5 5"/></svg>';
const play = '<span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 18 18" fill="#fff"><path d="M5 3.5v11l9-5.5z"/></svg></span>';
// Poster image if provided, otherwise the category's placeholder tone.
const media = (c, p) => p && p.poster ? `background-image:url('${esc(p.poster)}')` : `--ph:${c.tone}`;

function render() {
  document.body.style.overflow = '';
  const [slug, idx] = location.hash.replace('#', '').split('/');
  const cat = CATS.find(c => c.slug === slug);
  if (!cat) {
    app.innerHTML = `<section class="wrap intro">
      <h1 class="display page-title">Projects</h1>
      <p class="lede">Pick a category to see more examples of that type of work.</p>
      <div class="cats">${CATS.map(c => `
        <a class="cat" href="#${c.slug}"><span class="cat-media"><span class="ph" style="--ph:${c.tone}"><span class="ph-label">[Category thumbnail]</span></span></span>
          <span class="cat-body"><span class="cat-title">${esc(c.title)}${arrow}</span><span class="cat-desc">${esc(c.desc)}</span></span></a>`).join('')}
      </div></section>`;
    return;
  }
  const ratio = cat.vertical ? '9 / 16' : '16 / 9', fmt = cat.vertical ? 'Vertical 9:16' : 'Landscape 16:9';
  const list = PROJECTS[cat.slug];
  app.innerHTML = `<section class="wrap gallery">
    <a class="btn-ghost btn-sm" href="#">${back}Back to projects</a>
    <h1 class="display page-title">${esc(cat.title)}</h1>
    <p class="lede">${esc(cat.desc)}</p>
    <div class="clips ${cat.vertical ? 'clips-portrait' : 'clips-land'}">${list.map((p, i) => `
      <a class="clip" href="#${cat.slug}/${i}" aria-label="Play ${esc(p.title)}">
        <span class="clip-media ph" style="aspect-ratio:${ratio};${media(cat, p)}">${p.poster ? '' : '<span class="ph-label">[Poster thumbnail]</span>'}${play}</span>
        <span class="clip-title">${esc(p.title)}</span>
        <span class="clip-meta">${fmt} · ${esc(p.role)}</span></a>`).join('')}
    </div>
    <div class="others">
      <p>Other categories</p>
      <div>${CATS.filter(c => c !== cat).map(c => `<a class="btn-ghost btn-sm" href="#${c.slug}">${esc(c.title)}</a>`).join('')}</div>
    </div></section>`;
  const p = idx != null ? list[+idx] : null;
  if (!p) return;
  const dlg = document.createElement('div');
  dlg.className = 'player-backdrop';
  dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true'); dlg.setAttribute('aria-label', p.title);
  dlg.innerHTML = `<div class="player${cat.vertical ? ' player-vertical' : ''}">
    <div class="player-stage" id="stage" style="aspect-ratio:${ratio}">
      <button class="player-poster ph" id="playBtn" type="button" aria-label="Play video" style="${media(cat, p)}">${p.poster ? '' : '<span class="ph-label">[Poster thumbnail]</span>'}${play}</button>
    </div>
    <div class="player-body">
      <div class="player-head">
        <div><h2>${esc(p.title)}</h2><p>${fmt} · ${esc(p.role)}</p></div>
        <a class="btn-ghost btn-sm" href="#${cat.slug}" aria-label="Close player">Close</a>
      </div>
      <dl class="facts">
        <div><dt>Brief</dt><dd>${esc(p.brief)}</dd></div>
        <div><dt>My contribution</dt><dd>${esc(p.contribution)}</dd></div>
        <div><dt>Tools</dt><dd>${esc(p.tools)}</dd></div>
      </dl>
      <div class="player-foot"><a class="link" href="#">Back to projects</a></div>
    </div></div>`;
  app.appendChild(dlg);
  document.body.style.overflow = 'hidden';
  const playBtn = dlg.querySelector('#playBtn');
  playBtn.focus({ preventScroll: true });
  // Playback starts only on click; poster shown until then.
  playBtn.addEventListener('click', () => {
    const stage = dlg.querySelector('#stage');
    stage.innerHTML = p.video
      ? `<video src="${esc(p.video)}" controls autoplay playsinline></video>`
      : '<span class="player-empty">[Video file or link plays here]</span>';
  });
  dlg.addEventListener('click', e => { if (e.target === dlg) location.hash = cat.slug; });
}
addEventListener('hashchange', render);
addEventListener('keydown', e => { if (e.key === 'Escape' && location.hash.includes('/')) location.hash = location.hash.split('/')[0]; });
render();
</script>
</body>
</html>
